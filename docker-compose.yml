services:
  secretary:
    build: .
    restart: unless-stopped
    env_file: .env
    # сеть сервера напрямую — так бот видит компьютеры в Tailscale (локальная модель)
    network_mode: host
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
